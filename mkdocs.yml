site_name: Lighter
exclude_docs: |
  /overrides/
theme:
  icon:
    repo: fontawesome/brands/github
  font:
    code: Roboto Mono
  name: material
  custom_dir: docs/overrides
  favicon: assets/images/lighter_favicon.png
  logo: assets/images/lighter_logo.png
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - header.autohide
    - content.tooltips
    - footnotes
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: fontawesome/solid/circle-half-stroke
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: fontawesome/solid/lightbulb
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: fontawesome/solid/moon
        name: Switch to system preference

extra_css:
  - assets/extra.css

# Plugins
# Auto API reference generation: https://mkdocstrings.github.io/recipes/#automatic-code-reference-pages
plugins:
  - search
  - autorefs
  - gen-files:
      scripts:
      - docs/gen_ref_pages.py
      - docs/gen_examples.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # Removed the default filter that excludes private members
            filters: null

nav:
  - Home: index.md
  - Start:
      - Installation: guides/compatibility.md
      - First experiment: quickstart.md
      - Compare and Continue: examples/compare-and-continue.md
      - Examples: examples/index.md
  - Concepts:
      - Recipes and composition: guides/configuration.md
      - Python projects and data: guides/custom-code.md
      - Native Lightning ownership: guides/lightning-module.md
      - LighterModule: guides/lighter-module.md
  - Workflows:
      - Train, select and continue: guides/training.md
      - Inspect and compare records: guides/experiment-records.md
      - Export predictions: guides/predictions.md
      - Freeze parameters: guides/freezing.md
  - Reference:
      - CLI: reference/cli.md
      - API: reference/
  - Help:
      - Troubleshooting: faq.md
      - Research practices: guides/best-practices.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables

repo_name: project-lighter/lighter
repo_url: https://github.com/project-lighter/lighter
edit_uri: edit/main/docs/
