trainer::fast_dev_run: True
trainer::accelerator: cpu

# Override batch_size by replacing the dataloader config
=data::train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 16
    num_workers: 2
    pin_memory: True
    shuffle: True
    dataset:
        _target_: torchvision.datasets.CIFAR10
        download: True
        root: ./.datasets/
        train: True
        transform:
            _target_: torchvision.transforms.Compose
            transforms:
                - _target_: torchvision.transforms.ToTensor
                - _target_: torchvision.transforms.Normalize
                  mean: [0.5, 0.5, 0.5]
                  std: [0.5, 0.5, 0.5]
        target_transform: null

=data::val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 16
    num_workers: 2
    pin_memory: True
    shuffle: False
    dataset:
        _target_: torchvision.datasets.CIFAR10
        download: True
        root: ./.datasets/
        train: False
        transform:
            _target_: torchvision.transforms.Compose
            transforms:
                - _target_: torchvision.transforms.ToTensor
                - _target_: torchvision.transforms.Normalize
                  mean: [0.5, 0.5, 0.5]
                  std: [0.5, 0.5, 0.5]
        target_transform: null
