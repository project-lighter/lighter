name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  # Temporary reviewed companion until the compatible release is available.
  PAIRED_SPARKWHEEL_SHA: f7f154bc87a9a409ed7548a9cde89cc566813ce4

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check:
          - format
          - lint
          - types

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
          install-deps: ${{ matrix.check == 'types' && 'true' || 'false' }}
          paired-sparkwheel-sha: ${{ github.event_name == 'pull_request' && matrix.check == 'types' && env.PAIRED_SPARKWHEEL_SHA || '' }}

      - name: Run format check
        if: matrix.check == 'format'
        run: uvx ruff format --diff

      - name: Run lint check
        if: matrix.check == 'lint'
        run: uvx ruff check

      - name: Run type check
        if: matrix.check == 'types'
        run: uv run --no-sync mypy src

  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
          paired-sparkwheel-sha: ${{ github.event_name == 'pull_request' && env.PAIRED_SPARKWHEEL_SHA || '' }}

      - name: Run pytest with coverage
        run: |
          uv run --no-sync coverage run -m pytest tests --durations=10 -m "not slow" \
            --junit-xml=test-results.xml \
            --html=test-report.html --self-contained-html
          uv run --no-sync coverage combine

      - name: Generate test summary
        if: always()
        run: python3 .github/scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py312
          retention-days: 7
          include-hidden-files: true
          path: |
            test-results.xml
            test-report.html
            .coverage
            .coverage.*
            paired-ci-requirements.txt

      - name: Generate coverage report
        run: uv run --no-sync coverage xml

      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: codecov/codecov-action@v5.4.3
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
