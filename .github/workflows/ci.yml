name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

env:
  FORCE_COLOR: 1

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check:
          - format
          - lint
          - types
          - docs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
          install-deps: ${{ (matrix.check == 'types' || matrix.check == 'docs') && 'true' || 'false' }}
          install-groups: ${{ matrix.check == 'docs' && '--only-group doc' || '--all-extras --all-groups' }}

      - name: Run format check
        if: matrix.check == 'format'
        run: uvx ruff format --diff

      - name: Run lint check
        if: matrix.check == 'lint'
        run: uvx ruff check

      - name: Run type check
        if: matrix.check == 'types'
        run: uv run mypy src

      - name: Build docs (broken links, anchors and snippets fail the build)
        if: matrix.check == 'docs'
        run: uv run --only-group doc mkdocs build --strict

  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"

      - name: Run pytest with coverage
        run: |
          uv run coverage run -m pytest tests --durations=10 -m "not slow" \
            --junit-xml=test-results.xml \
            --html=test-report.html --self-contained-html

      - name: Generate test summary
        if: always()
        run: python3 .github/scripts/test_summary.py >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py312
          retention-days: 7
          path: |
            test-results.xml
            test-report.html
            .coverage

      - name: Generate coverage report
        run: uv run coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.4.3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false  # the uploader can fail its own signature check after the tests pass
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  quickstart:
    name: README quick start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Use CPU-only torch on Linux (the default wheel downloads CUDA)
        if: runner.os == 'Linux'
        run: echo "PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu" >> "$GITHUB_ENV"

      - name: Train the quick start in a clean venv, as the README does
        run: |  # the venv sits outside the checkout, so the wheel is what gets imported
          python -m venv ../venv
          source ../venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/activate
          pip install dist/lighter-*.whl
          (cd examples/quickstart && lighter fit config.yaml trainer::max_epochs=1)
          test -f examples/quickstart/lightning_logs/version_0/config.yaml
          cd .. && python -c "import sys, lighter.engine.runner; assert 'torch' not in sys.modules, 'the CLI imports torch'"
