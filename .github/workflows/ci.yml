name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

env:
  FORCE_COLOR: 1

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check:
          - format
          - lint
          - types

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-lighter
        with:
          python-version: "3.12"
          install-deps: ${{ matrix.check == 'types' && 'true' || 'false' }}

      - name: Run format check
        if: matrix.check == 'format'
        run: uvx ruff format --diff

      - name: Run lint check
        if: matrix.check == 'lint'
        run: uvx ruff check

      - name: Run type check
        if: matrix.check == 'types'
        run: uv run mypy src

  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-lighter
        with:
          python-version: "3.12"

      - name: Run pytest with coverage
        run: |
          uv run coverage run -m pytest tests --durations=10 -m "not slow" \
            --junit-xml=test-results.xml \
            --html=test-report.html --self-contained-html

      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results.xml ]; then
            python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('test-results.xml')
          root = tree.getroot()
          tests = int(root.get('tests', 0))
          failures = int(root.get('failures', 0))
          errors = int(root.get('errors', 0))
          skipped = int(root.get('skipped', 0))
          passed = tests - failures - errors - skipped
          print(f'- ✅ Passed: {passed}')
          print(f'- ❌ Failed: {failures}')
          print(f'- ⚠️  Errors: {errors}')
          print(f'- ⏭️  Skipped: {skipped}')
          print(f'- **Total: {tests}**')
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py312
          retention-days: 7
          path: |
            test-results.xml
            test-report.html
            .coverage

      - name: Generate coverage report
        run: uv run coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.4.3
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
