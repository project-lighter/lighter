# R3D (3D ResNet) for Video Action Recognition
#
# 3D CNN using spatiotemporal convolutions for video classification.
#
# Run: lighter fit configs/base.yaml configs/r3d.yaml

vars:
  height: 112
  width: 112
  batch_size: 4

trainer:
  max_epochs: 50
  accumulate_grad_batches: 4  # Effective batch size = 16

  callbacks:
    - _target_: pytorch_lightning.callbacks.EarlyStopping
      monitor: val/top1_accuracy_epoch
      mode: max
      patience: 10

    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val/top1_accuracy_epoch
      mode: max
      save_top_k: 1
      filename: r3d-{epoch}-{val/top1_accuracy_epoch:.4f}

model:
  _target_: project.models.model.VideoClassificationModel

  network:
    _target_: project.networks.video_models.R3D
    num_classes: "%vars::num_classes"
    in_channels: 3
    num_frames: "%vars::frames_per_clip"

  criterion:
    _target_: torch.nn.CrossEntropyLoss
    label_smoothing: 0.1

  optimizer:
    _target_: torch.optim.AdamW
    params: $@model::network.parameters()
    lr: 0.0001
    weight_decay: 0.05

  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    optimizer: "@model::optimizer"
    T_max: 50

  train_metrics:
    _target_: torchmetrics.MetricCollection
    metrics:
      top1_accuracy:
        _target_: torchmetrics.classification.MulticlassAccuracy
        num_classes: "%vars::num_classes"
        top_k: 1
      top5_accuracy:
        _target_: torchmetrics.classification.MulticlassAccuracy
        num_classes: "%vars::num_classes"
        top_k: 5

  val_metrics: "%model::train_metrics"
  test_metrics: "%model::train_metrics"

data:
  train_dataloader:
    batch_size: "%vars::batch_size"
    dataset:
      _target_: project.dataset.VideoClipDataset
      size: ["%vars::height", "%vars::width"]
      dataset:
        _target_: torchvision.datasets.UCF101
        root: ./.datasets/UCF-101
        annotation_path: ./.datasets/ucfTrainTestlist
        frames_per_clip: "%vars::frames_per_clip"
        frame_rate: "%vars::frame_rate"
        train: true

  val_dataloader:
    batch_size: "%vars::batch_size"
    dataset:
      _target_: project.dataset.VideoClipDataset
      size: ["%vars::height", "%vars::width"]
      dataset:
        _target_: torchvision.datasets.UCF101
        root: ./.datasets/UCF-101
        annotation_path: ./.datasets/ucfTrainTestlist
        frames_per_clip: "%vars::frames_per_clip"
        frame_rate: "%vars::frame_rate"
        train: false
