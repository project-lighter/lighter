# Example config using auto-discovery feature
# Run this from the cifar10 directory: cd projects/cifar10 && lighter fit experiments/example_autodiscovery.yaml
# The __lighter__.py marker file allows Lighter to auto-discover this project

trainer:
    _target_: pytorch_lightning.Trainer
    max_epochs: 100
    accelerator: cpu
    # devices: 1  # 2
    # strategy: ddp
    log_every_n_steps: 10
    logger: False
    callbacks:
        - _target_: lighter.callbacks.FileWriter
          path: predictions  # Relative path will be resolved to output directory
          writer: tensor

model:
    _target_: project.model.CIFAR10Model

    network:
        _target_: "project.models.net.Net"

    criterion:
        _target_: torch.nn.CrossEntropyLoss

    optimizer:
        _target_: torch.optim.Adam
        params: "$@model::network.parameters()"
        lr: 0.001
        weight_decay: 0.00001

    # Flat naming for metrics (no nested structure)
    train_metrics:
        - _target_: torchmetrics.Accuracy
          task: multiclass
          num_classes: 10
          average: macro
        - _target_: torchmetrics.F1Score
          task: multiclass
          num_classes: 10
          average: macro
        - _target_: torchmetrics.Precision
          task: multiclass
          num_classes: 10
          average: macro
        - _target_: torchmetrics.Recall
          task: multiclass
          num_classes: 10
          average: macro
    val_metrics: "%::train_metrics"
    test_metrics: "%::train_metrics"

data:
    _target_: lighter.LighterDataModule

    train_dataloader:
        _target_: torch.utils.data.DataLoader
        batch_size: 512
        num_workers: 2
        pin_memory: True
        shuffle: True
        dataset:
            _target_: torchvision.datasets.CIFAR10
            download: True
            root: ./.datasets/
            train: True
            transform:
                _target_: torchvision.transforms.Compose
                transforms:
                    - _target_: torchvision.transforms.ToTensor
                    - _target_: torchvision.transforms.Normalize
                      mean: [0.5, 0.5, 0.5]
                      std: [0.5, 0.5, 0.5]
            target_transform: null

    val_dataloader:
        _target_: torch.utils.data.DataLoader
        batch_size: 512
        num_workers: 2
        pin_memory: True
        shuffle: False
        dataset:
            _target_: torchvision.datasets.CIFAR10
            download: True
            root: ./.datasets/
            train: False
            transform:
                _target_: torchvision.transforms.Compose
                transforms:
                    - _target_: torchvision.transforms.ToTensor
                    - _target_: torchvision.transforms.Normalize
                      mean: [0.5, 0.5, 0.5]
                      std: [0.5, 0.5, 0.5]
            target_transform: null

    test_dataloader: "%data::val_dataloader"
    predict_dataloader: "%data::val_dataloader"
