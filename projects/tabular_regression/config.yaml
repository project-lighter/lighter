seed: 17
output_dir: outputs/tabular_regression

model:
  _target_: project.task.RegressionTask
  network:
    _target_: torch.nn.Linear
    in_features: 2
    out_features: 1
  criterion:
    _target_: torch.nn.MSELoss
  optimizer:
    _target_: torch.optim.SGD
    params: "$@model::network.parameters()"
    lr: 0.01
    momentum: 0.2

trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: cpu
  devices: 1
  max_epochs: 3
  logger: false
  default_root_dir: "@output_dir"
  enable_progress_bar: false
  enable_model_summary: false
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: "$@output_dir + '/checkpoints'"
      filename: "epoch-{epoch:02d}-step-{step}"
      auto_insert_metric_name: false
      monitor: val/loss/epoch
      mode: min
      save_top_k: 1
      save_last: true
    - _target_: lighter.callbacks.CsvWriter
      path: "$@output_dir + '/predictions.csv'"
      keys: [id, prediction, target]

data:
  _target_: lighter.LighterDataModule
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: project.task.RegressionSamples
      split: train
    batch_size: 8
    shuffle: true
    num_workers: 0
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: project.task.RegressionSamples
      split: val
    batch_size: 4
    num_workers: 0
  test_dataloader:
    _target_: torch.utils.data.DataLoader
    dataset:
      _target_: project.task.RegressionSamples
      split: test
    batch_size: 3
    num_workers: 0
  predict_dataloader: "@data::test_dataloader"
