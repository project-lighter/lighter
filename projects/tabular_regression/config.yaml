trainer:
  _target_: pytorch_lightning.Trainer
  max_epochs: 20
  log_every_n_steps: 4

model:
  _target_: project.task.Regression
  network:
    _target_: torch.nn.Linear
    in_features: 2
    out_features: 1
  criterion:
    _target_: torch.nn.MSELoss
  optimizer:
    _target_: torch.optim.SGD
    _mode_: callable  # LighterModule calls it with the model's parameters
    lr: 0.1
    momentum: 0.9
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _mode_: callable  # LighterModule calls it with the optimizer
    T_max: "@trainer::max_epochs"
  val_metrics:
    _target_: torchmetrics.MeanAbsoluteError
  test_metrics: "%model::val_metrics"  # a copy of the definition: a separate metric object

data:
  _target_: lighter.LighterDataModule
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 8
    shuffle: true
    dataset:
      _target_: project.task.Samples
      split: train
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 16
    dataset:
      _target_: project.task.Samples
      split: val
  test_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 16
    dataset:
      _target_: project.task.Samples
      split: test
  predict_dataloader: "%data::test_dataloader"
